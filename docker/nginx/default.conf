server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        # 用 Docker 内建 DNS + 变量形式的 upstream：nginx 对写死的主机名只在启动时解析一次，
        # api 容器重建换 IP 后会一直连旧地址、整站 502，必须重启 web 才恢复。
        resolver 127.0.0.11 valid=10s ipv6=off;
        # proxy_pass 里一旦出现变量，nginx 就不再做 location 前缀替换，
        # 必须用 $request_uri 原样透传（含查询串），否则所有请求都会被打成 /api/。
        set $upstream_api api;
        proxy_pass http://$upstream_api:5050$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}